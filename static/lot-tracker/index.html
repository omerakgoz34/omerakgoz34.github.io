<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8f1fb" />
    <meta name="description" content="Track warehouse products, Artikel numbers, and LOT changes. Open the files directly — no install, no build." />
    <title>LOT Tracker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./pico.blue.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        var t = localStorage.getItem("lotkeep.theme");
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        document.documentElement.style.colorScheme = d ? "dark" : "light";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", d ? "#071422" : "#e8f1fb");
        var l = localStorage.getItem("lotkeep.lang");
        if (l !== "en" && l !== "tr" && l !== "de") {
          var n = (navigator.language || "").toLowerCase();
          l = n.indexOf("tr") === 0 ? "tr" : n.indexOf("de") === 0 ? "de" : "en";
        }
        document.documentElement.lang = l;
        document.title = { en: "LOT Tracker", tr: "LOT Takibi", de: "LOT-Tracker" }[l] || "LOT Tracker";
        window.__lkLang = l;
        window.__lkTheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite" aria-busy="true">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="3.5" y="8.5" width="19" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 14.5h19" stroke="currentColor" stroke-width="1.6"/>
        <path d="M13 8.5v16" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
        <rect x="17.5" y="5.5" width="11" height="9" rx="1.5" fill="currentColor"/>
        <path d="M20 10h6M20 12.2h4" stroke="#eef5fc" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <p id="boot-msg">Loading the database, please wait...</p>
      <div class="boot-spin" aria-hidden="true"></div>
    </div>

    <div id="app" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <input id="import-file" class="sr-file" type="file" accept=".json,application/json,text/json,text/plain" />
    <input id="photo-file" class="sr-file" type="file" accept="image/*" />

    <noscript>
      <main class="wrap">
        <h1>LOT Tracker</h1>
        <p>Turn on JavaScript to track products, Artikel numbers, and LOT changes.</p>
      </main>
    </noscript>

    <script>
      (function () {
        var l = window.__lkLang || "en";
        var msg = {
          en: "Loading the database, please wait...",
          tr: "Veritabanı yükleniyor, lütfen bekleyin...",
          de: "Datenbank wird geladen, bitte warten..."
        };
        var el = document.getElementById("boot-msg");
        if (el && msg[l]) el.textContent = msg[l];
      })();
    </script>
    <script src="./app.js"></script>
    <script src="https://grok.com/grok-app-builder/extensions.js"></script>
  </body>
</html>
