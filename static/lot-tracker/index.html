<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <meta name="description" content="Track warehouse products, reference numbers, and LOT changes." />
    <title>LOT Tracker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f3f1ec; color: #1c1e22; }
      html.dark, html.dark body { background: #0c0d0f; color: #ece8e1; }
      .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      }
      .boot svg { width: 3rem; height: 3rem; }
      .boot p { margin: 0; max-width: 24rem; font-size: 0.875rem; opacity: 0.72; }
      .boot-spin {
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid color-mix(in srgb, currentColor 18%, transparent);
        border-top-color: #3f5f6b;
        border-radius: 999px;
        animation: boot-spin 0.7s linear infinite;
      }
      html.dark .boot-spin { border-top-color: #8aa4b0; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      try {
        var t = localStorage.getItem("lotkeep.theme");
        var d = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (d) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = d ? "dark" : "light";
        var l = localStorage.getItem("lotkeep.lang");
        if (l !== "en" && l !== "tr" && l !== "de") {
          var n = (navigator.language || "").toLowerCase();
          l = n.indexOf("tr") === 0 ? "tr" : n.indexOf("de") === 0 ? "de" : "en";
        }
        document.documentElement.lang = l;
        var names = { en: "LOT Tracker", tr: "LOT Takibi", de: "LOT-Tracker" };
        document.title = names[l] || names.en;
        window.__lkLang = l;
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root">
      <main class="boot" role="status" aria-live="polite" aria-busy="true">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="3.5" y="8.5" width="19" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 14.5h19" stroke="currentColor" stroke-width="1.6"/>
          <path d="M13 8.5v16" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
          <rect x="17.5" y="5.5" width="11" height="9" rx="1.5" fill="currentColor"/>
          <path d="M20 10h6M20 12.2h4" stroke="#f7f4ef" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <p id="boot-msg">Loading the database, please wait...</p>
        <div class="boot-spin" aria-hidden="true"></div>
      </main>
    </div>
    <script>
      (function () {
        var l = window.__lkLang || "en";
        var msg = {
          en: "Loading the database, please wait...",
          tr: "Veritabanı yükleniyor, lütfen bekleyin...",
          de: "Datenbank wird geladen, bitte warten..."
        };
        var el = document.getElementById("boot-msg");
        if (el && msg[l]) el.textContent = msg[l];
      })();
    </script>
    <script src="./app.js"></script>
  </body>
</html>
