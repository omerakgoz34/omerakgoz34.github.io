<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dev Yapım v1</title>
<meta name="description" content="Dev Yapım — motion design ve video prodüksiyon stüdyosu. Reklam filmi, fragman, animasyon, kurgu, renk ve ses.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="72x72" href="https://omerakgoz34.github.io/android-icon-72x72.png" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://i.vimeocdn.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN). Production'da `npx tailwindcss` ile derlenmiş CSS kullanın. -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { ink: '#000000', paper: '#FFFFFF', red: { DEFAULT: '#FF1A1A' } },
        fontFamily: {
          display: ['Unbounded', 'Archivo', 'Helvetica', 'Arial', 'sans-serif'],
          sans: ['Archivo', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>

<style>
/* ============================================================
   DEV YAPIM — kinetic motion studio
   İçerik: content.json (yönetici paneli: admin.html). Dosya doğrudan
   açıldığında (file://) aşağıdaki gömülü JSON kopyası kullanılır.
   Color  — ink #000000 · paper #FFFFFF · red #FF1A1A (tek vurgu)
   Type   — Unbounded 900 (display/logo) · Archivo (body) · IBM Plex Mono (etiket)
   ============================================================ */
:root{
  --ink:#000000; --paper:#FFFFFF; --red:#FF1A1A;
  --dim:rgba(255,255,255,.5); --line:rgba(255,255,255,.14);
  --gutter:clamp(20px,5vw,72px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--red);color:var(--paper)}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.font-display{font-family:Unbounded,Archivo,Helvetica,Arial,sans-serif}
.font-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.label{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---- split text masks ---- */
.mask{overflow:hidden;display:inline-block;vertical-align:bottom}
.ch,.w{display:inline-block;will-change:transform}
.w{white-space:pre}

/* ---- nav ---- */
#nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0));pointer-events:none}
#nav > *{pointer-events:auto}
.logo{font-family:Unbounded,sans-serif;font-weight:900;letter-spacing:-.06em;line-height:1;
  text-shadow:.045em .045em 0 var(--red);text-decoration:none;color:var(--paper)}
.nav-link{position:relative;text-decoration:none;color:var(--paper);font-size:.85rem;letter-spacing:.02em}
.nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--red);
  transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav-link:hover::after{transform:scaleX(1);transform-origin:left}
.btn{display:inline-flex;align-items:center;gap:.6em;border:1px solid var(--paper);color:var(--paper);
  text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.8em 1.3em;position:relative;overflow:hidden;isolation:isolate;transition:color .35s var(--ease),border-color .35s}
.btn::before{content:"";position:absolute;inset:0;background:var(--red);z-index:-1;transform:translateY(101%);transition:transform .45s var(--ease)}
.btn:hover{border-color:var(--red)}
.btn:hover::before{transform:translateY(0)}
.btn.solid{background:var(--paper);color:var(--ink)}
.btn.solid:hover{color:var(--paper)}

/* ---- progress ---- */
#progress{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none;
  margin-top:env(safe-area-inset-top,0px)}

/* ---- hero ---- */
#hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  padding-top:calc(6rem + env(safe-area-inset-top,0px))}
.hero-logo{position:relative;font-family:Unbounded,sans-serif;font-weight:900;letter-spacing:-.07em;line-height:.82;
  font-size:clamp(7rem,30vw,24rem);user-select:none;filter:blur(0)}
.hero-logo .layer{display:block}
.hero-logo .layer.red{position:absolute;left:.045em;top:.045em;color:var(--red);z-index:0}
.hero-logo .layer.white{position:relative;z-index:1;color:var(--paper)}
.hero-logo .mask{padding-bottom:.08em;margin-bottom:-.08em}
.hero-logo.glitch .layer.red{animation:split .35s steps(2) 2}
@keyframes split{0%{transform:translate(0,0)}50%{transform:translate(-.08em,.02em)}100%{transform:translate(.03em,-.03em)}}
#arc{position:absolute;left:50%;bottom:-2vw;transform:translateX(-50%);width:160vw;max-width:none;height:auto;pointer-events:none;z-index:0}
#arc path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
.rot-word{display:inline-grid;vertical-align:bottom;color:var(--red)}
.rot-word > span{grid-area:1/1;white-space:nowrap}
.scroll-cue{width:1px;height:56px;background:var(--line);position:relative;overflow:hidden}
.scroll-cue::after{content:"";position:absolute;left:0;top:0;width:100%;height:40%;background:var(--red);animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%{transform:translateY(-100%)}100%{transform:translateY(260%)}}

/* ---- marquee ---- */
.marquee{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.marquee-track{display:inline-flex;gap:0;animation:marquee 28s linear infinite;will-change:transform}
.marquee-item{font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(2rem,6vw,4.5rem);line-height:1.15;letter-spacing:-.03em;padding:.1em .4em}
.marquee-item.outline{color:transparent;-webkit-text-stroke:1px var(--paper)}
.marquee-item .dot{display:inline-block;width:.28em;height:.28em;background:var(--red);vertical-align:middle;margin-left:.8em}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ---- section titles ---- */
.sec-head{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:1.5rem}
.sec-title{font-family:Unbounded,sans-serif;font-weight:900;letter-spacing:-.05em;line-height:.9;font-size:clamp(3rem,10vw,8.5rem);text-wrap:balance}
.rule{height:1px;background:var(--paper);transform-origin:left}
.bg-word{text-transform:lowercase;position:absolute;right:-2vw;top:0;font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(8rem,26vw,22rem);line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.12);pointer-events:none;user-select:none;white-space:nowrap;z-index:0}

/* ---- works ---- */
.work{position:relative;display:block;cursor:pointer;background:#000;isolation:isolate;-webkit-tap-highlight-color:transparent}
.work .frame{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;clip-path:inset(0 0 0 0)}
.work .player,.work .player > *,.work .poster{position:absolute;inset:0;width:100%;height:100%;display:block;border:0}
.work .player{z-index:1}
.work .player > video{object-fit:cover;transform:scale(1.02)}
.work .player > iframe{transform:scale(1.03);pointer-events:none}
.work .poster{z-index:2;object-fit:cover;background:#111;transition:opacity .5s var(--ease),transform .9s var(--ease)}
.work.is-playing .poster{opacity:0;transform:scale(1.04)}
.work .corner{position:absolute;width:14px;height:14px;z-index:3;opacity:0;transition:opacity .4s var(--ease),transform .5s var(--ease)}
.work .corner::before,.work .corner::after{content:"";position:absolute;background:var(--red)}
.work .corner::before{left:0;top:0;width:100%;height:2px}
.work .corner::after{left:0;top:0;width:2px;height:100%}
.work .c1{left:12px;top:12px;transform:translate(-8px,-8px)}
.work .c2{right:12px;top:12px;transform:rotate(90deg) translate(-8px,-8px)}
.work .c3{right:12px;bottom:12px;transform:rotate(180deg) translate(-8px,-8px)}
.work .c4{left:12px;bottom:12px;transform:rotate(270deg) translate(-8px,-8px)}
.work:hover .corner,.work.is-playing .corner{opacity:1}
.work:hover .c1,.work.is-playing .c1{transform:translate(0,0)}
.work:hover .c2,.work.is-playing .c2{transform:rotate(90deg) translate(0,0)}
.work:hover .c3,.work.is-playing .c3{transform:rotate(180deg) translate(0,0)}
.work:hover .c4,.work.is-playing .c4{transform:rotate(270deg) translate(0,0)}
.work .badge{position:absolute;left:50%;top:50%;margin:-42px 0 0 -42px;z-index:4;pointer-events:none;
  width:84px;height:84px;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.16em;opacity:0;scale:.4;transition:opacity .3s,scale .45s var(--ease)}
.work:hover .badge{opacity:1;scale:1}
.work.is-loading .badge{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (hover:none){.work .badge{display:none}}
.work .tap{position:absolute;right:12px;bottom:12px;z-index:4;display:none;align-items:center;gap:.5em;
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.7);padding:.5em .8em;border:1px solid var(--line)}
.work .tap::before{content:"";width:0;height:0;border-left:8px solid var(--paper);border-top:5px solid transparent;border-bottom:5px solid transparent}
.work.is-playing .tap::before{border:0;width:8px;height:10px;border-left:3px solid var(--paper);border-right:3px solid var(--paper)}
@media (hover:none){.work .tap{display:inline-flex}}
.work .meta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-top:.9rem;border-top:1px solid var(--line);margin-top:.9rem}
.work .title{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(1rem,1.6vw,1.35rem);letter-spacing:-.02em;transition:transform .5s var(--ease);margin:0}
.work .title a{color:inherit;text-decoration:none}
.work:hover .title{transform:translateX(.4em)}
.work .title::before{content:"";display:inline-block;width:0;height:2px;background:var(--red);vertical-align:middle;margin-right:0;transition:width .5s var(--ease),margin .5s var(--ease)}
.work:hover .title::before{width:.6em;margin-right:.4em}
.work .dur{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.14em;position:absolute;left:14px;bottom:12px;z-index:3;background:rgba(0,0,0,.6);padding:.35em .6em;color:var(--paper)}
@media (min-width:768px){.work:nth-child(even){transform:translateY(6rem)}}

/* ---- services ---- */
.svc{position:relative;display:grid;grid-template-columns:4rem 1fr;gap:1rem;align-items:start;padding:1.6rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
@media (min-width:768px){.svc{grid-template-columns:6rem 1fr 1fr auto;align-items:center;padding:2rem 0}}
.svc .num{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--dim)}
.svc .name{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(1.35rem,3.2vw,2.6rem);letter-spacing:-.03em;line-height:1.05;transition:letter-spacing .6s var(--ease),color .3s}
.svc:hover .name{letter-spacing:.01em;color:var(--red)}
.svc .desc{color:var(--dim);font-size:.95rem;max-width:42ch;line-height:1.5;grid-column:2}
@media (min-width:768px){.svc .desc{grid-column:auto}}
.svc .shape{width:40px;height:40px;display:none;position:relative}
@media (min-width:768px){.svc .shape{display:block}}
.svc .shape::before{content:"";position:absolute;inset:0;border:2px solid var(--paper);transition:transform .7s var(--ease),border-color .3s,border-radius .7s var(--ease)}
.svc:hover .shape::before{transform:rotate(135deg);border-color:var(--red);border-radius:50%}
.svc::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.svc:hover::after{transform:scaleX(1)}

/* ---- contact ---- */
.big-link{font-family:Unbounded,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-size:clamp(1.3rem,3.6vw,3rem);color:var(--paper);text-decoration:none;display:inline-block;position:relative;word-break:break-word;filter:blur(0)}
.big-link::after{content:"";position:absolute;left:0;bottom:-.08em;height:.07em;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.big-link:hover::after{transform:scaleX(1)}
.big-link:hover{text-shadow:.03em .03em 0 var(--red)}

/* ---- footer ---- */
.foot-link{color:var(--dim);text-decoration:none;font-size:.85rem;transition:color .3s}
.foot-link:hover{color:var(--red)}

/* ---- reduced motion ---- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .marquee-track,.scroll-cue::after,.hero-logo.glitch .layer.red,.work.is-loading .badge{animation:none}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="progress" aria-hidden="true"></div>

<!-- NAV -->
<header id="nav" class="wrap">
  <div class="flex items-center justify-between py-5 md:py-6">
    <a href="#top" class="logo text-2xl md:text-3xl nav-item" data-bind="site.logo_text" aria-label="Dev Yapım — başa dön">dev</a>
    <nav class="hidden md:flex items-center gap-10" aria-label="Site" id="nav-links"></nav>
    <a class="btn nav-item" id="nav-cta" href="#iletisim"><span data-bind="site.cta_label">Proje başlat</span> <span aria-hidden="true">→</span></a>
  </div>
</header>

<main id="top">

<!-- HERO -->
<section id="hero" class="wrap">
  <svg id="arc" viewBox="0 0 1600 420" aria-hidden="true">
    <path id="arc-ghost" d="M0 420 A 1200 1200 0 0 1 1600 420" stroke="rgba(255,255,255,.14)"/>
    <path id="arc-red" d="M0 420 A 1200 1200 0 0 1 1600 420" stroke="#FF1A1A"/>
  </svg>

  <div class="relative z-10 grid gap-10 pb-10 md:pb-14">
    <div class="flex items-center gap-6 hero-meta">
      <span class="label" data-bind="hero.meta_left">Motion studio</span>
      <span class="h-px w-10 bg-white/30" aria-hidden="true"></span>
      <span class="label" data-bind="hero.meta_right">İstanbul — 2026</span>
    </div>

    <h1 class="hero-logo" aria-label="dev yapım">
      <span class="layer red" aria-hidden="true" data-split="chars" data-bind="site.logo_text">dev</span>
      <span class="layer white" aria-hidden="true" data-split="chars" data-bind="site.logo_text">dev</span>
    </h1>

    <div class="grid md:grid-cols-[1fr_auto] gap-8 md:gap-16 items-end">
      <p class="hero-sub font-display font-bold leading-[1.12] tracking-tight text-[clamp(1.35rem,3.4vw,2.6rem)] max-w-[22ch]" id="hero-sub"></p>
      <div class="flex items-end gap-8 hero-meta">
        <div class="scroll-cue" aria-hidden="true"></div>
        <div class="grid gap-3">
          <span class="label" data-bind="hero.small_label">yapım · reklam · fragman</span>
          <a id="showreel" href="#isler" class="btn solid"><span data-bind="hero.showreel_label">Showreel</span> <span aria-hidden="true">▶</span></a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MARQUEE -->
<div class="marquee" aria-hidden="true">
  <div class="marquee-track" id="marquee"></div>
</div>

<!-- İŞLER -->
<section id="isler" class="wrap relative pt-24 md:pt-36 pb-24 md:pb-40 overflow-hidden">
  <div class="bg-word" aria-hidden="true" data-parallax data-bind="works.title">işler</div>
  <div class="relative z-10">
    <div class="sec-head">
      <h2 class="sec-title" data-split="chars" data-bind="works.title">İşler</h2>
      <div class="rule mb-3 md:mb-5" data-rule></div>
    </div>
    <div class="flex flex-wrap justify-between gap-4 mt-6 md:mt-8">
      <p class="label" data-bind="works.label_left"></p>
      <p class="label" data-bind="works.label_right"></p>
    </div>
    <div class="grid md:grid-cols-2 gap-x-10 gap-y-14 md:gap-y-20 mt-14 md:mt-20 md:pb-24" id="works"></div>
  </div>
</section>

<!-- HİZMETLER -->
<section id="hizmetler" class="wrap relative pt-24 md:pt-36 pb-24 md:pb-40 overflow-hidden border-t border-white/10">
  <div class="bg-word" aria-hidden="true" data-parallax data-bind="services.title">hizmet</div>
  <div class="relative z-10">
    <div class="sec-head">
      <h2 class="sec-title" data-split="chars" data-bind="services.title">Hizmetler</h2>
      <div class="rule mb-3 md:mb-5" data-rule></div>
    </div>
    <p class="label mt-6 md:mt-8" data-bind="services.label"></p>
    <div class="mt-12 md:mt-16 border-t border-white/10" id="services"></div>
  </div>
</section>

<!-- İLETİŞİM -->
<section id="iletisim" class="wrap relative pt-24 md:pt-36 pb-24 md:pb-36 border-t border-white/10 overflow-hidden">
  <div class="relative z-10 grid gap-12 md:gap-20">
    <div class="sec-head">
      <h2 class="sec-title" data-split="chars" data-bind="contact.title">Konuşalım</h2>
      <div class="rule mb-3 md:mb-5" data-rule></div>
    </div>
    <div class="grid md:grid-cols-[1fr_auto] gap-10 md:gap-16 items-end">
      <div class="grid gap-5 min-w-0">
        <p class="label" data-bind="contact.label"></p>
        <div class="grid gap-3" id="contact-links"></div>
      </div>
      <div class="grid gap-5 md:text-right">
        <div class="grid gap-5" id="socials"></div>
        <p class="label mt-4"><span data-bind="contact.address"></span><br><span data-bind="contact.hours"></span></p>
      </div>
    </div>
  </div>
</section>

</main>

<!-- FOOTER -->
<footer class="wrap border-t border-white/10 py-8 md:py-10">
  <div class="flex flex-wrap items-center justify-between gap-6">
    <a href="#top" class="logo text-xl" data-bind="site.logo_text" aria-label="Dev Yapım">dev</a>
    <nav class="flex flex-wrap gap-6" aria-label="Alt menü" id="foot-links"></nav>
    <p class="label" data-bind="footer.copy"></p>
  </div>
</footer>

      { "title": "Yusuf Yusuf — Fragman", "category": "Fragman", "year": "2015", "vimeo": "117719047", "mp4": "", "webm": "", "poster": "https://i.vimeocdn.com/video/504520213-55e179c10775dddee9748e0ff0b1745e4e4e97cff04b69b28188e20fedfde6d1-d_1280x720?&r=pad&region=us", "link": "https://vimeo.com/117719047" },
      { "title": "İksir: Dedemin Sırrı", "category": "Fragman", "year": "2015", "vimeo": "117718028", "mp4": "", "webm": "", "poster": "https://i.vimeocdn.com/video/504521451-76259cab31e3dd200d57e0d354c6ce75bbc0f265a44c7e5263e9d20334f41d92-d_1280x720?&r=pad&region=us", "link": "https://vimeo.com/117718028" },

  "services": {

      { "name": "Fragman & TV spot", "desc": "Sinema fragmanı, TV ve dijital spot. İlk 3 saniyede tutan, salonda ve telefonda aynı vuran kurgu." },
      { "name": "Reklam filmi", "desc": "TV, dijital ve sosyal mecralar için senaryodan çekime, kurgudan yayına tam prodüksiyon." },
      { "name": "Kurumsal tanıtım", "desc": "Şirketinizi 90 saniyede anlatan, yatırımcı ve müşteri karşısında çalışan filmler." },
      { "name": "Motion graphics", "desc": "Kinetik tipografi, logo animasyonu, açıklayıcı videolar. Markanın hareket dili baştan kurulur." },
      { "name": "Sosyal medya içeriği", "desc": "Reels, Shorts ve story formatlarında seri üretim; her kare dikey ve ilk 2 saniyede tutar." },
      { "name": "Post-prodüksiyon", "desc": "Kurgu, renk düzenleme, ses tasarımı ve VFX. Teslim: 4K ProRes, H.264, dikey varyantlar." }
    ]
  },
  "contact": {
    "title": "Konuşalım",
    "label": "Yeni proje, brief ya da sadece selam",
    "email": "hello@devyapim.com",
    "phones": [
      { "display": "+90 500 000 00 00", "tel": "+905000000000" }
    ],
    "socials": [
      { "label": "Instagram → @devyapimtv", "url": "https://www.instagram.com/devyapimtv/" },
      { "label": "Vimeo → devyapim", "url": "https://vimeo.com/tariksonmezdevyapim" },
      { "label": "YouTube → Dev Yapım", "url": "https://www.youtube.com/" }
    ],
    "address": "İstanbul, Türkiye",
    "hours": "Pzt–Cum 10:00–19:00"
  },
  "footer": {
    "copy": "© 2026 Dev Yapım · Her kare bize ait."
  }

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(async () => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasGsap = typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined';
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------- 0. İçeriği yükle: ?preview=1 → localStorage taslağı; sunucu → content.json; yoksa gömülü kopya ---------- */
  async function loadContent() {
    const fallback = JSON.parse(document.getElementById('content-fallback').textContent);
    if (new URLSearchParams(location.search).get('preview') === '1') {
      try { const d = localStorage.getItem('devyapim.preview'); if (d) return JSON.parse(d); } catch (e) {}
    }
    if (location.protocol === 'file:') return fallback;
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 2500);
      const r = await fetch('content.json?v=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (r.ok) return await r.json();
    } catch (e) {}
    return fallback;
  }
  const C = await loadContent();
  const get = (p) => p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), C);
  const el = (tag, attrs = {}, children = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'html') n.innerHTML = v; else n.setAttribute(k, v);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => c != null && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  };

  /* ---------- 1. Render ---------- */
  document.querySelectorAll('[data-bind]').forEach(n => { const v = get(n.dataset.bind); if (v != null) n.textContent = v; });
  document.title = C.site.name || document.title;
  const nav = document.getElementById('nav-links'), foot = document.getElementById('foot-links');
  (C.site.nav || []).forEach(l => {
    nav.appendChild(el('a', { class: 'nav-link nav-item', href: l.url, text: l.label }));
    foot.appendChild(el('a', { class: 'foot-link', href: l.url, text: l.label }));
  });
  document.getElementById('nav-cta').href = C.site.cta_url || '#iletisim';
  document.getElementById('showreel').href = C.hero.showreel_url || '#isler';

  // hero cümlesi + dönen kelime
  const sub = document.getElementById('hero-sub');
  const rot = el('span', { class: 'rot-word', 'aria-label': (C.hero.rotating_words || [''])[0] });
  (C.hero.rotating_words || []).forEach(w => rot.appendChild(el('span', { 'data-rot': '', text: w })));
  sub.append(C.hero.tagline_before + ' ', rot, ' ' + C.hero.tagline_after);

  // marquee (sorunsuz döngü için iki kopya)
  const mq = document.getElementById('marquee');
  for (let k = 0; k < 2; k++) (C.marquee || []).forEach((t, i) => {
    mq.appendChild(el('span', { class: 'marquee-item' + (i % 2 ? ' outline' : '') }, [t, el('span', { class: 'dot' })]));
  });

  // işler
  const worksEl = document.getElementById('works');
  (C.works.items || []).forEach((w, i) => {
    const vimeoId = String(w.vimeo || '').match(/(\d{6,})/)?.[1] || '';
    const link = w.link || (vimeoId ? 'https://vimeo.com/' + vimeoId : '');
    const card = el('article', { class: 'work', 'data-reveal': '', 'data-vimeo': vimeoId, 'data-mp4': w.mp4 || '', 'data-webm': w.webm || '' }, [
      el('div', { class: 'frame' }, [
        el('div', { class: 'player', 'aria-hidden': 'true' }),
        el('img', { class: 'poster', src: w.poster || '', alt: '', loading: i < 2 ? 'eager' : 'lazy', decoding: 'async' }),
        el('span', { class: 'corner c1' }), el('span', { class: 'corner c2' }), el('span', { class: 'corner c3' }), el('span', { class: 'corner c4' }),
        el('span', { class: 'badge', 'aria-hidden': 'true', text: 'İZLE' }),
        el('span', { class: 'tap', 'aria-hidden': 'true', text: 'Oynat' }),
      ]),
      el('div', { class: 'meta' }, [
        el('h3', { class: 'title' }, link ? el('a', { href: link, target: '_blank', rel: 'noopener', text: w.title }) : w.title),
        el('span', { class: 'label', text: [w.category, w.year].filter(Boolean).join(' · ') }),
      ]),
    ]);
    worksEl.appendChild(card);
  });

  // hizmetler
  const svcEl = document.getElementById('services');
  (C.services.items || []).forEach((s, i) => {
    svcEl.appendChild(el('a', { class: 'svc', href: '#iletisim', 'data-svc': '' }, [
      el('span', { class: 'num', text: String(i + 1).padStart(2, '0') }),
      el('span', { class: 'name', text: s.name }),
      el('span', { class: 'desc', text: s.desc }),
      el('span', { class: 'shape', 'aria-hidden': 'true' }),
    ]));
  });

  // iletişim
  const cl = document.getElementById('contact-links');
  if (C.contact.email) cl.appendChild(el('a', { class: 'big-link', href: 'mailto:' + C.contact.email, 'data-contact': '', text: C.contact.email }));
  (C.contact.phones || []).forEach(p => cl.appendChild(el('a', { class: 'big-link', href: 'tel:' + (p.tel || p.display || '').replace(/[^+\d]/g, ''), 'data-contact': '', text: p.display })));
  const so = document.getElementById('socials');
  (C.contact.socials || []).forEach(s => so.appendChild(el('a', { class: 'nav-link', href: s.url, target: '_blank', rel: 'noopener', text: s.label })));

  /* ---------- 2. Split text (harf / kelime) ---------- */
  function splitChars(n) {
    const text = n.textContent; n.textContent = '';
    [...text].forEach(ch => {
      const m = el('span', { class: 'mask' }, el('span', { class: 'ch', text: ch === ' ' ? ' ' : ch }));
      n.appendChild(m);
    });
  }
  function splitWords(n) {
    [...n.childNodes].forEach(node => {
      if (node.nodeType !== 3) { if (node.nodeType === 1) node.classList.add('w'); return; }
      const frag = document.createDocumentFragment();
      node.textContent.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
        frag.appendChild(el('span', { class: 'mask' }, el('span', { class: 'w', text: part })));
      });
      node.replaceWith(frag);
    });
  }
  document.querySelectorAll('[data-split]').forEach(n => {
    if (!n.hasAttribute('aria-label') && !n.closest('[aria-label]')) n.setAttribute('aria-label', n.textContent.trim());
    n.dataset.split === 'chars' ? splitChars(n) : splitWords(n);
  });
  splitWords(sub);

  /* ---------- 3. Hover video (masaüstü) / tap video (mobil) — Vimeo embed veya mp4 ---------- */
  const VIMEO = 'https://player.vimeo.com';
  const players = new Map(); // iframe.contentWindow -> card

  function makePlayer(card) {
    const holder = card.querySelector('.player');
    const vimeo = card.dataset.vimeo, mp4 = card.dataset.mp4, webm = card.dataset.webm;
    let node = null, loaded = false, pendingPlay = false, loadTimer = null;

    const markPlaying = () => { card.classList.remove('is-loading'); card.classList.add('is-playing'); };
    const post = (method, value) => {
      if (!node || !node.contentWindow) return;
      node.contentWindow.postMessage({ method, value }, VIMEO);
    };

    if (vimeo) {
      return {
        play() {
          card.classList.add('is-loading');
          if (!node) {
            node = el('iframe', {
              src: `${VIMEO}/video/${vimeo}?background=1&autoplay=1&muted=1&loop=1&autopause=0&dnt=1`,
              allow: 'autoplay; fullscreen', title: 'Önizleme', loading: 'eager', tabindex: '-1',
            });
            node.addEventListener('load', () => {
              loaded = true; players.set(node.contentWindow, card);
              post('setVolume', 0); post('addEventListener', 'timeupdate'); post('addEventListener', 'play');
              if (pendingPlay) post('play');
            });
            holder.appendChild(node);
            pendingPlay = true;
            // olay gelmezse de 2.5 sn sonra posteri kaldır
            loadTimer = setTimeout(() => { if (card.classList.contains('is-loading')) markPlaying(); }, 2500);
          } else {
            post('setCurrentTime', 0); post('play');
            loadTimer = setTimeout(() => { if (card.classList.contains('is-loading')) markPlaying(); }, 1200);
          }
        },
        stop() {
          clearTimeout(loadTimer); pendingPlay = false;
          card.classList.remove('is-playing', 'is-loading');
          if (node) { post('pause'); post('setCurrentTime', 0); }
        },
        onMessage(d) {
          if ((d.event === 'timeupdate' && d.data && d.data.seconds > 0.05) || d.event === 'play') {
            if (card.classList.contains('is-loading')) markPlaying();
          }
        },
      };
    }
    // mp4 / webm (kendi sunucunuzdaki kısa klip)
    return {
      play() {
        if (!node) {
          node = el('video', { muted: '', loop: '', playsinline: '', preload: 'auto' });
          node.muted = true; node.defaultMuted = true;
          if (mp4) node.appendChild(el('source', { src: mp4, type: 'video/mp4' }));
          if (webm) node.appendChild(el('source', { src: webm, type: 'video/webm' }));
          holder.appendChild(node);
        }
        card.classList.add('is-loading');
        node.play().then(markPlaying).catch(() => card.classList.remove('is-loading'));
      },
      stop() {
        card.classList.remove('is-playing', 'is-loading');
        if (node) { node.pause(); try { node.currentTime = 0; } catch (e) {} }
      },
      onMessage() {},
    };
  }

  window.addEventListener('message', e => {
    if (e.origin !== VIMEO) return;
    let d = e.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (err) { return; } }
    const card = players.get(e.source);
    if (card && card._player) card._player.onMessage(d);
  });

  const works = [...document.querySelectorAll('.work')];
  let touchPlaying = null;
  works.forEach(card => {
    const p = makePlayer(card); card._player = p; card._stop = p.stop;
    const badge = card.querySelector('.badge');
    if (fine) {
      card.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') p.play(); });
      card.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') p.stop(); });
      if (badge && hasGsap) {
        const qx = gsap.quickTo(badge, 'x', { duration: .35, ease: 'power3' });
        const qy = gsap.quickTo(badge, 'y', { duration: .35, ease: 'power3' });
        card.addEventListener('pointermove', e => {
          const r = card.querySelector('.frame').getBoundingClientRect();
          qx(e.clientX - r.left - r.width / 2); qy(e.clientY - r.top - r.height / 2);
        });
      }
    }
    card.querySelector('.frame').addEventListener('click', e => {
      if (fine) return; // masaüstünde hover yeterli; başlık linki Vimeo'ya gider
      e.preventDefault();
      if (card.classList.contains('is-playing') || card.classList.contains('is-loading')) { p.stop(); touchPlaying = null; return; }
      if (touchPlaying && touchPlaying !== card) touchPlaying._stop();
      touchPlaying = card; p.play();
    });
    card.querySelector('.frame').tabIndex = 0;
    card.querySelector('.frame').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.contains('is-playing') ? p.stop() : p.play(); }
    });
  });
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting && (en.target.classList.contains('is-playing') || en.target.classList.contains('is-loading'))) en.target._stop();
    }), { threshold: 0.1 });
    works.forEach(w => io.observe(w));
  }

  /* ---------- 4. Dönen kelime (hero) ---------- */
  const rots = [...document.querySelectorAll('[data-rot]')];
  let ri = 0;
  rots.forEach((r, i) => { if (i) r.style.opacity = 0; });
  if (!reduce && rots.length > 1) {
    setInterval(() => {
      const cur = rots[ri]; ri = (ri + 1) % rots.length; const nxt = rots[ri];
      if (hasGsap) {
        gsap.to(cur, { yPercent: -60, opacity: 0, duration: .5, ease: 'power3.in' });
        gsap.fromTo(nxt, { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .6, ease: 'power3.out', delay: .35 });
      } else { cur.style.opacity = 0; nxt.style.opacity = 1; }
    }, 2600);
  }

  if (!hasGsap || reduce) return; // animasyonsuz ama tam görünür sayfa

  /* ---------- 5. GSAP ---------- */
  gsap.registerPlugin(ScrollTrigger);
  gsap.defaults({ ease: 'power4.out' });

  const arc = document.getElementById('arc-red');
  const len = arc.getTotalLength();
  gsap.set(arc, { strokeDasharray: len, strokeDashoffset: len });

  const tl = gsap.timeline();
  tl.from('.nav-item', { y: -16, opacity: 0, duration: .8, stagger: .07 }, .1)
    .from('.hero-logo .layer.white .ch', { yPercent: 120, rotate: 8, duration: 1.2, stagger: .09 }, .25)
    .from('.hero-logo .layer.red .ch', { yPercent: 120, rotate: 8, duration: 1.2, stagger: .09 }, .33)
    .to(arc, { strokeDashoffset: 0, duration: 2.2, ease: 'power3.inOut' }, .4)
    .from('.hero-sub .w', { yPercent: 110, duration: .9, stagger: .05 }, .95)
    .from('.hero-meta', { opacity: 0, y: 12, duration: .8, stagger: .1 }, 1.3)
    .add(() => document.querySelector('.hero-logo').classList.add('glitch'), 1.6);

  const heroLogo = document.querySelector('.hero-logo');
  heroLogo.addEventListener('pointerenter', () => {
    heroLogo.classList.remove('glitch'); void heroLogo.offsetWidth; heroLogo.classList.add('glitch');
  });

  gsap.to('#progress', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: .3 } });

  gsap.to('.hero-logo', {
    yPercent: -12, opacity: .15, filter: 'blur(8px)', ease: 'none',
    scrollTrigger: { trigger: '#hero', start: 'bottom 85%', end: 'bottom 20%', scrub: true }
  });

  document.querySelectorAll('.sec-title').forEach(t => {
    gsap.from(t.querySelectorAll('.ch'), {
      yPercent: 110, rotate: 4, duration: 1, stagger: .035,
      scrollTrigger: { trigger: t, start: 'top 85%', once: true }
    });
  });
  document.querySelectorAll('[data-rule]').forEach(r => {
    gsap.from(r, { scaleX: 0, duration: 1.4, ease: 'power3.inOut', scrollTrigger: { trigger: r, start: 'top 90%', once: true } });
  });
  document.querySelectorAll('[data-parallax]').forEach(w => {
    gsap.fromTo(w, { xPercent: 10 }, { xPercent: -25, ease: 'none', scrollTrigger: { trigger: w.parentElement, start: 'top bottom', end: 'bottom top', scrub: true } });
  });
  document.querySelectorAll('[data-reveal]').forEach(c => {
    gsap.from(c.querySelector('.frame'), {
      clipPath: 'inset(0 0 100% 0)', duration: 1.3, ease: 'power4.inOut',
      scrollTrigger: { trigger: c, start: 'top 85%', once: true }
    });
    gsap.from(c.querySelector('.meta'), {
      y: 24, opacity: 0, duration: .9, delay: .5,
      scrollTrigger: { trigger: c, start: 'top 85%', once: true }
    });
  });
  if (document.querySelector('[data-svc]')) gsap.from('[data-svc]', {
    x: -40, opacity: 0, duration: 1, stagger: .09,
    scrollTrigger: { trigger: '#services', start: 'top 80%', once: true }
  });
  if (document.querySelector('[data-contact]')) gsap.from('[data-contact]', {
    opacity: 0, y: 30, filter: 'blur(14px)', duration: 1.2, stagger: .15,
    scrollTrigger: { trigger: '#iletisim', start: 'top 70%', once: true }
  });
  document.querySelectorAll('.work').forEach(card => {
    const t = card.querySelector('.title');
    card.addEventListener('pointerenter', () => gsap.fromTo(t, { skewX: -6 }, { skewX: 0, duration: .6 }));
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
})();
</script>
